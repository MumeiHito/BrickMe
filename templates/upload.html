<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickMe - Upload Your Photo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background shapes */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: rotate 60s linear infinite;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .upload-container {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.98);
      padding: 60px 50px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 3.5rem;
      margin-bottom: 10px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .upload-container h1 {
      margin-bottom: 15px;
      color: #2d3748;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #718096;
      font-size: 1rem;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .upload-area {
      border: 3px dashed #cbd5e0;
      border-radius: 16px;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: linear-gradient(135deg, #edf2f7 0%, #e6fffa 100%);
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 4rem;
      color: #667eea;
      margin-bottom: 15px;
      display: block;
      line-height: 1;
    }

    .upload-text {
      color: #2d3748;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      white-space: nowrap;
      line-height: 1.5;
    }

    .upload-hint {
      color: #a0aec0;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .upload-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
    }

    .upload-btn:active {
      transform: translateY(0);
    }

    input[type="file"] {
      display: none;
    }

    .features {
      margin-top: 30px;
      display: flex;
      justify-content: space-around;
      gap: 20px;
    }

    .feature {
      flex: 1;
      padding: 15px;
      background: #f7fafc;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #4a5568;
    }

    .feature-icon {
      font-size: 1.5rem;
      margin-bottom: 5px;
      display: block;
    }

    @media (max-width: 600px) {
      .upload-container {
        padding: 40px 30px;
      }

      .features {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <div class="logo">🧱</div>
    <h1>BrickMe</h1>
    <p class="subtitle">Find your perfect LEGO minifigure match!<br>Upload a full-body photo to get started</p>
    
    <form method="post" enctype="multipart/form-data" id="upload-form">
      <label for="file-upload" class="upload-area">
        <span class="upload-icon">📸</span>
        <div class="upload-text">Click to Upload Photo</div>
        <div class="upload-hint">Supports JPG, JPEG, PNG</div>
      </label>
      <input id="file-upload" type="file" name="file" accept="image/png,image/jpeg,image/jpg" onchange="handleFileSelect(this)">
    </form>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">✂️</span>
        <strong>Easy Crop</strong>
      </div>
      <div class="feature">
        <span class="feature-icon">🤖</span>
        <strong>AI Match</strong>
      </div>
      <div class="feature">
        <span class="feature-icon">🧩</span>
        <strong>Get Results</strong>
      </div>
    </div>
  </div>

  <script>
    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
        
        if (validTypes.includes(file.type)) {
          document.getElementById('upload-form').submit();
        } else {
          alert('Please select a valid image file (PNG, JPG, or JPEG)');
          input.value = '';
        }
      }
    }
  </script>
</body>
</html>
