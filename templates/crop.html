<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cropper/cropper.min.css') }}">
  <style>
    body {
      background-color: #f0f0f0; /* светло-серый фон */
      font-family: Arial, sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #444;
    }

    .crop-btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background-color 0.3s ease;
    }

    .crop-btn:hover {
      background-color: #45a049;
    }

    img {
      max-width: 100%;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    form {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ title }}</h1>

    <!-- Confirm crop button -->
    <form id="crop-form" method="POST">
      <button type="submit" class="crop-btn">✅ Confirm and Next</button>
      <input type="hidden" name="x">
      <input type="hidden" name="y">
      <input type="hidden" name="width">
      <input type="hidden" name="height">
    </form>

    <!-- Image to crop -->
    <img id="image" src="{{ url_for('uploaded_file', filename=filename) }}">

  </div>

  <script src="{{ url_for('static', filename='cropper/cropper.min.js') }}"></script>
  <script>
    const image = document.getElementById('image');
    const form = document.getElementById('crop-form');
    const cropper = new Cropper(image, {
      viewMode: 1,
      autoCropArea: 0.8,
      movable: true,
      zoomable: true,
      scalable: false,
      rotatable: false,
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const cropData = cropper.getData(true);
      form.x.value = cropData.x;
      form.y.value = cropData.y;
      form.width.value = cropData.width;
      form.height.value = cropData.height;
      form.submit(); // submit the form
    });
  </script>
</body>
</html>
